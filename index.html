<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸盒小景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4a3b32;
    --paper: #fbf6ea;
    --paper2: #f3ead7;
    --mat: #3b6470;
    --cream: #fff9ee;
    --red: #e25b4a;
    --gold: #f3b23a;
    --display: "ZCOOL KuaiLe", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --body: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.5 var(--body); color: var(--ink);
    background-color: var(--mat);
    background-image:
      linear-gradient(rgba(255,255,255,.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.13) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    background-position: -1px -1px;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; }

  #app {
    display: grid; grid-template-columns: minmax(0, 1fr) 318px; grid-template-rows: auto minmax(0, 1fr);
    height: 100vh; gap: 12px 16px; padding: 12px 16px 14px;
  }

  /* ---------- 顶栏 ---------- */
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 48px;
  }
  .brand {
    font: 26px/1 var(--display); color: var(--ink); background: #f5e7c6;
    padding: 8px 18px 7px; transform: rotate(-1.5deg);
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    clip-path: polygon(2% 0, 98% 4%, 100% 50%, 97% 100%, 3% 96%, 0 50%);
    letter-spacing: 2px;
  }
  .seg { display: flex; background: rgba(0,0,0,.18); border-radius: 999px; padding: 4px; gap: 3px; }
  .seg button {
    border: 0; background: transparent; color: #f4ecdc; font: 16px/1 var(--display);
    padding: 7px 13px 6px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s, transform .1s;
  }
  .seg button:hover { background: rgba(255,255,255,.12); }
  .seg button .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.7); }
  .seg button.on { background: var(--cream); color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .seg button.on .dot { border-color: var(--ink); }
  .seg button svg { width: 16px; height: 16px; }
  .spacer { flex: 1; }
  .chip {
    border: 2px solid var(--ink); background: var(--cream); border-radius: 12px;
    padding: 6px 12px 5px; font: 16px/1 var(--display); cursor: pointer;
    box-shadow: 0 3px 0 var(--ink); display: inline-flex; align-items: center; gap: 6px;
    transition: transform .08s, box-shadow .08s;
  }
  .chip:hover { background: #fff; }
  .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .chip svg { width: 17px; height: 17px; }
  .chip b { font-weight: normal; background: var(--ink); color: var(--cream); border-radius: 8px; padding: 2px 6px 1px; font-size: 13px; }
  .chip.primary { background: #ffd56b; }
  .chip.icon { padding: 6px 8px 5px; }
  .chip:disabled { opacity: .45; cursor: default; transform: none; box-shadow: 0 3px 0 var(--ink); }

  /* ---------- 舞台 ---------- */
  #stageWrap { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stageBox { position: relative; }
  #stage { display: block; border-radius: 16px; box-shadow: 0 18px 30px rgba(0,0,0,.35), 0 4px 8px rgba(0,0,0,.2); touch-action: none; }
  #tip {
    margin-top: 12px; color: #eaf1ee; font-size: 14px; display: flex; align-items: center; gap: 8px; min-height: 22px;
    opacity: .92; transition: opacity .4s;
  }
  #tip .bulb { width: 20px; height: 20px; flex: none; }

  #selBar {
    position: absolute; display: none; transform: translate(-50%, -100%);
    background: var(--cream); border: 2px solid var(--ink); border-radius: 12px; padding: 3px; gap: 2px;
    box-shadow: 0 3px 0 var(--ink); z-index: 5;
  }
  #selBar.show { display: flex; }
  #selBar button { border: 0; background: transparent; width: 32px; height: 30px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
  #selBar button:hover { background: #f0e4cc; }
  #selBar button.danger:hover { background: #f8d2cb; }
  #selBar svg { width: 18px; height: 18px; }
  #selBar .nm { font: 14px/30px var(--display); padding: 0 8px 0 6px; border-right: 1.5px dashed #d8c7a8; margin-right: 2px; white-space: nowrap; }

  #ghost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; display: none; filter: drop-shadow(6px 10px 6px rgba(0,0,0,.3)); }

  #toasts { position: absolute; left: 14px; top: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 6; pointer-events: none; }
  .toast {
    display: flex; gap: 10px; align-items: center; background: var(--cream); border: 2px solid var(--ink);
    border-radius: 14px; padding: 8px 12px 8px 8px; box-shadow: 0 4px 0 var(--ink), 0 10px 20px rgba(0,0,0,.25);
    width: 264px; animation: slap .45s cubic-bezier(.2,1.6,.4,1) both; transform-origin: 20% 50%;
  }
  .toast.out { animation: peelOff .4s ease-in forwards; }
  .toast canvas { width: 50px; height: 50px; flex: none; }
  .toast .k { font: 13px/1 var(--display); color: var(--red); letter-spacing: 1px; }
  .toast .n { font: 19px/1.15 var(--display); }
  .toast .d { font-size: 12px; opacity: .85; line-height: 1.4; }
  .toast .u { margin-top: 4px; font-size: 12px; display: inline-block; background: #ffe7a3; border-radius: 6px; padding: 1px 7px; }
  @keyframes slap { from { opacity: 0; transform: translateY(-14px) rotate(-6deg) scale(1.15); } to { opacity: 1; transform: none; } }
  @keyframes peelOff { to { opacity: 0; transform: translate(-30px, -12px) rotate(-10deg); } }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 80; }
  #flash.go { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

  /* ---------- 贴纸册 ---------- */
  #side {
    min-height: 0; display: flex; flex-direction: column; gap: 12px;
  }
  .book {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: var(--paper); border-radius: 16px; box-shadow: 0 12px 26px rgba(0,0,0,.3), 0 2px 0 rgba(0,0,0,.1);
    position: relative; overflow: hidden;
  }
  .book::before { /* 装订线 */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px;
    background: repeating-linear-gradient(90deg, transparent 0 14px, rgba(74,59,50,.25) 14px 20px); opacity: .6;
  }
  .book h2 { margin: 16px 16px 8px; font: 20px/1 var(--display); display: flex; align-items: baseline; gap: 8px; }
  .book h2 small { font: 12px var(--body); opacity: .6; }
  #tabs { display: flex; gap: 4px; padding: 0 12px; }
  #tabs button {
    flex: 1; border: 2px solid var(--ink); border-bottom: 0; background: var(--paper2); border-radius: 10px 10px 0 0;
    font: 15px/1 var(--display); padding: 8px 0 7px; cursor: pointer; position: relative; top: 2px;
  }
  #tabs button.on { background: #fffdf7; z-index: 1; }
  #tabs button .nd { position: absolute; top: 4px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  #shelf {
    flex: 1; min-height: 0; overflow-y: auto; margin: 0 12px 12px; padding: 10px 8px;
    border: 2px solid var(--ink); border-radius: 0 0 12px 12px; background:
      linear-gradient(rgba(120,150,170,.12) 1px, transparent 1px) 0 0 / 100% 22px, #fffdf7;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-content: start;
  }
  .tile {
    position: relative; border-radius: 12px; padding: 6px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    cursor: grab; touch-action: none; transition: background .12s, transform .12s;
  }
  .tile:hover { background: rgba(74,59,50,.07); transform: translateY(-2px) rotate(-1deg); }
  .tile:active { cursor: grabbing; }
  .tile canvas { width: 76px; height: 66px; display: block; pointer-events: none; }
  .tile .nm { font: 13px/1.2 var(--display); }
  .tile.locked { cursor: default; }
  .tile.locked:hover { transform: none; background: transparent; }
  .tile.locked .nm { opacity: .5; }
  .tile .new { position: absolute; top: 2px; right: 4px; background: var(--red); color: #fff; font: 11px/1 var(--display); border-radius: 7px; padding: 3px 5px 2px; }

  /* ---------- 委托卡 ---------- */
  .job {
    background: #fffdf7; border-radius: 16px; padding: 12px 14px 12px; position: relative;
    box-shadow: 0 12px 26px rgba(0,0,0,.3), 0 2px 0 rgba(0,0,0,.1);
    background-image: linear-gradient(90deg, transparent 30px, rgba(226,91,74,.25) 30px 31.5px, transparent 31.5px);
  }
  .job .pin { position: absolute; top: -7px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff9a8a, var(--red) 60%, #a83a2c); box-shadow: 0 3px 4px rgba(0,0,0,.35); }
  .job .hd { display: flex; gap: 10px; align-items: center; padding-left: 26px; }
  .job .hd canvas { width: 46px; height: 46px; flex: none; }
  .job .tt { font: 19px/1.1 var(--display); }
  .job .tx { font-size: 12.5px; opacity: .8; line-height: 1.4; margin-top: 2px; }
  .conds { list-style: none; margin: 8px 0 8px 26px; padding: 0; font-size: 13px; }
  .conds li { display: flex; align-items: center; gap: 7px; padding: 1.5px 0; }
  .conds li i { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--ink); flex: none; display: grid; place-items: center; font-style: normal; font-size: 10px; line-height: 1; }
  .conds li.ok i { background: #7cc36a; color: #fff; }
  .conds li.ok span { opacity: .6; text-decoration: line-through; text-decoration-color: rgba(74,59,50,.5); }
  .conds li.bonus i { border-radius: 4px; border-color: var(--gold); color: var(--gold); }
  .conds li.bonus.ok i { background: var(--gold); color: #fff; }
  .conds .sep { font: 12px var(--display); opacity: .55; margin-top: 4px; }
  .conds .sep:first-child { margin-top: 0; }
  .conds li em { font-style: normal; font-size: 11.5px; color: #9a7b5c; margin-left: 6px; }
  .job .ft { display: flex; align-items: center; gap: 10px; padding-left: 26px; }
  .job .stars { font-size: 16px; color: var(--gold); letter-spacing: 2px; flex: 1; }
  .job .stars .off { color: #d8cdb8; }
  .job button.link { border: 0; background: none; text-decoration: underline; font-size: 12.5px; cursor: pointer; opacity: .7; padding: 0; }
  .job button.link:hover { opacity: 1; }
  #btnDeliver.ready { animation: wiggle 1.4s ease-in-out infinite; background: #9fe07f; }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-4deg); } 85% { transform: rotate(4deg); } 95% { transform: rotate(-2deg); } }
  .job.empty { text-align: center; padding: 18px 14px; }

  /* ---------- 弹窗 ---------- */
  #modal { position: fixed; inset: 0; background: rgba(28,40,44,.55); display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  #modal.show { display: flex; animation: fadeIn .2s; }
  @keyframes fadeIn { from { opacity: 0; } }
  .sheet {
    background: var(--paper); border-radius: 18px; max-width: 980px; width: 100%; max-height: 88vh; display: flex; flex-direction: column;
    box-shadow: 0 24px 50px rgba(0,0,0,.45); animation: pop .3s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.94) rotate(-1deg); opacity: 0; } }
  .sheet .top { display: flex; align-items: center; gap: 12px; padding: 16px 20px 10px; }
  .sheet .top h3 { margin: 0; font: 26px/1 var(--display); }
  .sheet .top .sub { opacity: .65; font-size: 13px; }
  .sheet .top .x { margin-left: auto; }
  .sheet .body { overflow-y: auto; padding: 6px 20px 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { background: #fffdf7; border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid #eadfc9; }
  .card canvas { width: 58px; height: 58px; flex: none; }
  .card .n { font: 18px/1.2 var(--display); }
  .card .d { font-size: 12.5px; opacity: .8; line-height: 1.45; }
  .card .h { font-size: 12px; margin-top: 4px; color: #8a6f55; }
  .card.lock { background: transparent; border-style: dashed; }
  .card.lock .n { opacity: .5; }
  .card .u { font-size: 11.5px; background: #ffe7a3; border-radius: 6px; padding: 1px 6px; display: inline-block; margin-top: 4px; }
  .jobcard { flex-direction: column; gap: 6px; position: relative; padding-top: 16px; }
  .jobcard .row { display: flex; gap: 10px; align-items: center; }
  .jobcard .stars { color: var(--gold); letter-spacing: 2px; }
  .jobcard .stars .off { color: #d8cdb8; }
  .jobcard .go { align-self: flex-end; }
  .jobcard.cur { border-color: var(--ink); border-width: 2px; }
  .jobcard .pin { position: absolute; top: -6px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff9a8a, var(--red) 60%, #a83a2c); box-shadow: 0 2px 3px rgba(0,0,0,.35); }
  .album { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .polaroid { background: #fff; padding: 10px 10px 8px; box-shadow: 0 6px 14px rgba(0,0,0,.2); cursor: pointer; transition: transform .15s; }
  .polaroid:nth-child(odd) { transform: rotate(-1.5deg); } .polaroid:nth-child(even) { transform: rotate(1.2deg); }
  .polaroid:hover { transform: rotate(0) scale(1.03); }
  .polaroid img { width: 100%; display: block; }
  .polaroid .c { font: 15px/1.2 var(--display); margin-top: 7px; display: flex; justify-content: space-between; gap: 6px; }
  .polaroid .c small { font: 11px var(--body); opacity: .6; align-self: end; }
  .empty-note { text-align: center; padding: 40px; opacity: .7; }
  .viewer { text-align: center; }
  .viewer img { max-width: 100%; max-height: 62vh; box-shadow: 0 8px 20px rgba(0,0,0,.25); border: 10px solid #fff; border-bottom-width: 36px; }
  .viewer .acts { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }

  .done { text-align: center; padding: 10px 20px 24px; position: relative; }
  .done .photo { position: relative; display: inline-block; background: #fff; padding: 10px 10px 40px; box-shadow: 0 10px 24px rgba(0,0,0,.3); transform: rotate(-2deg); max-width: 92%; }
  .done .photo img { display: block; max-width: 560px; width: 100%; }
  .done .photo .cap { position: absolute; left: 0; right: 0; bottom: 8px; font: 18px var(--display); }
  .done .stamp {
    position: absolute; right: -14px; bottom: 30px; width: 116px; height: 116px; border-radius: 50%; border: 4px solid var(--red); color: var(--red);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font: 20px/1.1 var(--display); transform: rotate(-14deg);
    background: rgba(255,255,255,.35); animation: stamp .45s .35s cubic-bezier(.3,1.8,.5,1) both; box-shadow: inset 0 0 0 3px rgba(226,91,74,.25);
  }
  .done .stamp .st { font-size: 18px; letter-spacing: 1px; margin-top: 3px; }
  @keyframes stamp { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } }
  .done .thanks { font: 20px var(--display); margin: 22px 0 14px; }
  .done .acts { display: flex; gap: 12px; justify-content: center; }

  /* ---------- 笔记本屏 ---------- */
  @media (max-width: 1400px) {
    header { gap: 8px; }
    .brand { font-size: 22px; padding: 7px 14px 6px; }
    .seg button { padding: 6px 9px 5px; font-size: 15px; gap: 4px; }
    .chip { padding: 5px 9px 4px; font-size: 15px; gap: 4px; }
    .chip.icon { padding: 5px 6px 4px; }
  }
  @media (max-height: 820px) and (min-width: 981px) {
    #app { gap: 8px 14px; padding: 8px 14px 10px; }
    .book h2 { margin: 12px 14px 6px; font-size: 18px; }
    .tile canvas { width: 64px; height: 54px; }
    .job { padding: 10px 12px; }
    .job .hd canvas { width: 38px; height: 38px; }
    .job .tt { font-size: 17px; }
    .conds { margin: 6px 0 6px 26px; font-size: 12.5px; }
    .conds li { padding: 0.5px 0; }
    #tip { margin-top: 6px; font-size: 13px; }
  }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 980px) {
    body { overflow: auto; }
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
    #side { flex-direction: column; }
    .book { min-height: 380px; }
    #shelf { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); max-height: 360px; }
    .brand { font-size: 22px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">纸盒小景</div>
    <div class="seg" id="segSeason"></div>
    <div class="seg" id="segTime"></div>
    <div class="spacer"></div>
    <button class="chip" id="btnBook" title="看看已经发现的贴纸反应"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5V5.5M9 8h7M9 12h5"/></svg>图鉴 <b id="discCount">0/24</b></button>
    <button class="chip" id="btnJobs" title="挑一个委托"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3h6v3H9zM8 11h8M8 15h5"/></svg>委托 <b id="jobCount">0/9</b></button>
    <button class="chip" id="btnAlbum" title="拍过的照片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.6"/></svg>相册</button>
    <button class="chip primary" id="btnPhoto" title="把现在的盒子拍下来"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照</button>
    <button class="chip icon" id="btnUndo" title="撤销（Ctrl+Z）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="chip icon" id="btnClear" title="清空盒子"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button class="chip icon" id="btnMute" title="声音"><svg id="icoSound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="m" d="M17 9l5 6M22 9l-5 6" style="display:none"/></svg></button>
  </header>

  <div id="stageWrap">
    <div id="stageBox">
      <canvas id="stage"></canvas>
      <div id="selBar">
        <span class="nm" id="selName"></span>
        <button data-act="flip" title="翻转（F）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M8 7L3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg></button>
        <button data-act="smaller" title="缩小（-）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/></svg></button>
        <button data-act="bigger" title="放大（+）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h8M12 8v8"/></svg></button>
        <button data-act="copy" title="复制一张（Ctrl+D）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
        <button data-act="del" class="danger" title="撕掉（Delete）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
